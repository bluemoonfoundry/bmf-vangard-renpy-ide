name: Release Gate

# The canonical release gate (see CONTRIBUTING.md § Release Gate), shared by
# build.yml, nightly.yml and release.yml so every pipeline runs the exact same
# commands a developer runs locally with `npm run gate`:
#   checks -> npm run gate:checks  (typecheck, lint, test:coverage, build, docs:check)
#   e2e    -> npm run test:e2e     (Electron + Playwright smoke suite, Linux/xvfb)

on:
  workflow_call:
    inputs:
      os:
        description: 'JSON array of runner images for the checks job'
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    name: Gate checks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install docs site dependencies
        run: npm --prefix website ci

      - name: Run gate checks
        run: npm run gate:checks

  e2e:
    name: E2E Smoke Suite
    runs-on: ubuntu-latest
    needs: checks
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install xvfb
        run: sudo apt-get install -y xvfb libgbm-dev

      - name: Run E2E smoke suite
        # The pretest:e2e hook rebuilds dist/ first, so the suite never runs
        # against a missing or stale renderer build.
        run: xvfb-run --auto-servernum npm run test:e2e
